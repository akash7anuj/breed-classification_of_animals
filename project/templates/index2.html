<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cattle & Buffalo Breed Recognition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #e0f7fa, #fff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      border-radius: 1rem;
    }
    .preview-img {
      max-height: 300px;
      margin-top: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card shadow-lg">
          <div class="card-body text-center">
            <h2 class="card-title mb-4">🐄 Breed Recognition System</h2>

            {% if error %}
              <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
              <div class="mb-3">
                <input class="form-control" type="file" id="fileInput" name="file" accept="image/*" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">🔍 Predict Breed</button>
            </form>

            <!-- Image Preview -->
            <img id="preview" class="preview-img d-none" alt="Preview">

            {% if prediction %}
              <hr>
              <h4 class="mt-3">Prediction: <span class="text-success">{{ prediction }}</span></h4>

              <!-- Confidence with Progress bar -->
              <div class="progress mt-2">
                <div class="progress-bar bg-info" role="progressbar" 
                     style="width: {{ confidence|float * 100 }}%;" 
                     aria-valuenow="{{ confidence|float * 100 }}" 
                     aria-valuemin="0" aria-valuemax="100">
                  {{ (confidence|float * 100)|round(2) }}%
                </div>
              </div>

              <img src="{{ image_path }}" class="preview-img mt-3">
            {% endif %}
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS + Custom JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Image preview before upload
    document.getElementById("fileInput").addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.getElementById("preview");
          preview.src = e.target.result;
          preview.classList.remove("d-none");
        }
        reader.readAsDataURL(file);
      }
    });
  </script>

</body>
</html>
