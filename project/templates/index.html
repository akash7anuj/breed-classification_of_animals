<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cattle & Buffalo Breed Recognition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card shadow-lg rounded-4">
          <div class="card-body text-center">
            <h2 class="card-title mb-4">🐄 Breed Recognition</h2>
            
            {% if error %}
              <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
              <div class="mb-3">
                <input class="form-control" type="file" name="file" accept="image/*" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Predict Breed</button>
            </form>

            {% if prediction %}
              <hr>
              <h4 class="mt-3">Prediction: <span class="text-success">{{ prediction }}</span></h4>
              <p>Confidence: <strong>{{ confidence }}</strong></p>
              <img src="{{ image_path }}" class="img-fluid rounded mt-3 shadow" style="max-height:300px;">
            {% endif %}
          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
